{% extends "base.html" %}

{% block title %}确认比赛时间{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <a href="{{ url_for('tournament.match_detail', match_id=match.id) }}" class="btn btn-light rounded-pill mb-3">
            <i class="fas fa-arrow-left"></i> 返回比赛详情
        </a>
        <h2>
            <i class="fas fa-calendar-check"></i> 确认比赛时间
        </h2>
        <p class="text-muted">请与对手线下商讨后，在此确认双方约定的比赛时间</p>
    </div>
</div>

<div class="row">
    <div class="col-md-6 mx-auto">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-clock"></i> 设定比赛时间</h5>
            </div>
            <div class="card-body">
                {% if already_confirmed %}
                    <div class="alert alert-success mb-3">
                        <i class="fas fa-check-circle"></i> 您已确认过时间。如需修改，请重新选择。
                    </div>
                {% else %}
                    <div class="alert alert-info mb-3">
                        <i class="fas fa-info-circle"></i> <strong>提示：</strong>请先与对手线下沟通达成一致，再在此确认时间。确认后对方需在平台上同意。
                    </div>
                {% endif %}
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">比赛时间</label>
                        <input type="datetime-local" class="form-control" name="scheduled_time" required>
                        <div class="form-text text-muted">请填写与对手线下商讨后约定的时间</div>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-check"></i> 确认此时间
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
