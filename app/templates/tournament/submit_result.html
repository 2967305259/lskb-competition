{% extends "base.html" %}

{% block title %}提交成绩{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <a href="{{ url_for('tournament.match_detail', match_id=match.id) }}" class="btn btn-light rounded-pill mb-3">
            <i class="fas fa-arrow-left"></i> 返回比赛详情
        </a>
        <h2><i class="fas fa-upload"></i> 提交成绩</h2>
    </div>
</div>

<div class="row">
    <div class="col-md-6 mx-auto">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-camera"></i> 上传截图 & 选择难度</h5>
            </div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-4">
                        <label class="form-label"><i class="fas fa-fire"></i> 难度选择</label>
                        <select class="form-select" name="difficulty" required>
                            {% for d in range(difficulty_rule.minimum, difficulty_rule.maximum + 1) %}
                            <option value="{{ d }}">{{ d }} 难{% if match.scoring_rule %}（使用该整场保存的难度规则）{% endif %}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label"><i class="fas fa-star"></i> 整场原始成绩（0 分有效）</label>
                        <input type="number" class="form-control" name="score" placeholder="如：3200" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label"><i class="fas fa-images"></i> 截图上传（可选多张）</label>
                        <input type="file" class="form-control" name="screenshots" accept="image/*" multiple required>
                        <small class="text-muted">可同时选择多张成绩截图（PNG/JPG/WEBP）</small>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-check"></i> 提交成绩
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
