# Standalone SQLite deployment: docker compose -f docker-compose.sqlite.yml up --build
services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-p3-7}
        MYSQL_IMAGE: ${MYSQL_IMAGE:-mysql:8.0}
    image: ${IMAGE:-lskb-p0}:${IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "${PORT:-19198}:${PORT:-19198}"
    environment:
      FLASK_ENV: production
      LEGACY_APP_VERSION: ${LEGACY_APP_VERSION:-8238f20}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY explicitly}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD explicitly}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      DATABASE_URL: sqlite:////app/.db/lskb.db
      PORT: ${PORT:-19198}
      WEB_WORKERS: ${WEB_WORKERS:-4}
      EVENT_NAME: ${EVENT_NAME:-冷水坑杯}
      EVENT_TIMEZONE: ${EVENT_TIMEZONE:-Asia/Shanghai}
      SEASON_NUMBER: ${SEASON_NUMBER:-3}
      TOURNAMENT_NAME: ${TOURNAMENT_NAME:-}
      TEAM_SIZE: ${TEAM_SIZE:-4}
      TEAM_POSITIONS: ${TEAM_POSITIONS:-cold,normal1,normal2,pit}
      TRACK_LABEL: ${TRACK_LABEL:-肉鸽}
      MEMBER_FIELD1_LABEL: ${MEMBER_FIELD1_LABEL:-分队}
      MEMBER_FIELD2_LABEL: ${MEMBER_FIELD2_LABEL:-开局干员}
      SCHEDULE_SLOT_TIMES: ${SCHEDULE_SLOT_TIMES:-14:00,19:00}
      SCHEDULE_SLOT_MINUTES: ${SCHEDULE_SLOT_MINUTES:-120}
      DEFAULT_BONUS_SCORE: ${DEFAULT_BONUS_SCORE:-500}
      DEFAULT_DIFFICULTY_MIN: ${DEFAULT_DIFFICULTY_MIN:-12}
      DEFAULT_DIFFICULTY_MAX: ${DEFAULT_DIFFICULTY_MAX:-18}
      DEFAULT_DIFFICULTY_STEP: ${DEFAULT_DIFFICULTY_STEP:-0.1}
      BRAND_PRIMARY_COLOR: ${BRAND_PRIMARY_COLOR:-#0d6efd}
      STATE_DIR: /app/.runtime
      BACKUP_DIR: /app/backups
    volumes:
      - sqlite_data:/app/.db
      - uploads:/app/app/static/uploads
      - backups:/app/backups
      - state:/app/.runtime
      - ${IMAGE_HOST_DIR:-./image}:/app/image:ro
volumes:
  sqlite_data:
  uploads:
  backups:
  state:
